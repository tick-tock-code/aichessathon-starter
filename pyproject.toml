[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
chess = "==1.11.2"
numpy = "==2.5.2"
numba = "==0.67.0"
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cpu" }
onnxruntime = "==1.29.0"
mypy = ">=1.18"
ruff = ">=0.14"

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[tool.pixi.tasks]
play = "python -m harness.play --white . --black baselines/greedy"
arena = "python -m harness.arena --opponent baselines/greedy --games 20"
zip = "python -m harness.package"
lint = "ruff check ."
typecheck = "mypy"
test = "python -m unittest discover -s tests"
smoke = "python -m harness.arena --opponent baselines/random --games 2 --base-ms 5000"
gate = { depends-on = ["lint", "typecheck", "test", "smoke"] }

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tools/stockfish_arena.py" = ["E402"]

[tool.mypy]
strict = true
files = [
    "agent.py",
    "engine_aux.py",
    "engine_core.py",
    "engine_eval.py",
    "engine_experimental.py",
    "engine_neural.py",
    "engine_time.py",
    "harness",
]
